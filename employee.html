<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration - DAS</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./all.min.css">

  <style>
    .password-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-container input.form-control {
      width: 100%;
      padding-right: 42px !important;
    }

    #toggleRegPass {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #555;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      line-height: 1;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #toggleRegPass:hover {
      color: #0d6efd;
    }

    .employee-table {
      width: 100%;
      border-collapse: collapse;
    }

    .employee-table th,
    .employee-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .employee-table th {
      background: var(--primary-blue);
      color: white;
    }

    .employee-table td {
      white-space: nowrap;
    }

    .delete-attendance-btn {
      color: #dc3545;
      border: 1px solid #dc3545;
      background: white;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .delete-attendance-btn:hover {
      color: white;
      background: #dc3545;
    }

    @media (max-width: 600px) {
      #regForm > div:first-child {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>

<body>

<script src="./app.js"></script>
<script>
  if (typeof checkAuth === "function") checkAuth();
</script>

<div class="app-container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <i class="fa-solid fa-graduation-cap"></i>
      <h2>Digital Attendance System</h2>
      <p>Admin Panel</p>
    </div>

    <ul class="sidebar-menu">
      <li><a href="./dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>
      <li class="active"><a href="./employee.html"><i class="fa-solid fa-user-plus"></i> Employee Registration</a></li>
      <li><a href="./attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance Record</a></li>
      <li><a href="./monthly.html"><i class="fa-solid fa-calendar-days"></i> Monthly Record</a></li>
      <li><a href="#" onclick="logout(); return false;"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></li>
    </ul>

    <div class="sidebar-footer">
      <i class="fa-solid fa-user-circle"></i>
      <div>
        <strong>Welcome,</strong>
        <span>Admin</span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="topbar">
      <div><i class="fa-solid fa-bars"></i></div>
      <div class="topbar-info">
        <span><i class="fa-regular fa-calendar"></i> <span id="currentDate"></span></span>
      </div>
    </div>

    <div class="content-area">
      <h1 class="page-heading">
        <i class="fa-solid fa-user-plus" style="color:var(--primary-blue);"></i>
        Employee Registration
      </h1>
      <p class="page-subheading">Register Faculty or Staff under their department (Descending list).</p>

      <!-- REGISTRATION FORM -->
      <div class="card">
        <h3 id="formTitle" class="card-title">Register New Employee</h3>

        <form id="regForm">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <div class="form-group">
              <label for="empId">Employee ID (Primary Key) *</label>
              <input type="text" id="empId" class="form-control" required placeholder="e.g. EMP003">
            </div>

            <div class="form-group">
              <label for="empName">Full Name *</label>
              <input type="text" id="empName" class="form-control" required placeholder="e.g. Pedro Reyes">
            </div>

            <div class="form-group">
              <label for="empPass">Password *</label>
              <div class="password-container">
                <input type="password" id="empPass" class="form-control" required placeholder="Enter Password">
                <button type="button" id="toggleRegPass" aria-label="Show password" title="Show Password" onclick="toggleRegPassword()">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="empPos">Position / Group *</label>
              <select id="empPos" class="form-control" required>
                <option value="">Select Position</option>
                <option value="Faculty">Faculty</option>
                <option value="Staff">Staff</option>
              </select>
            </div>

            <div class="form-group">
              <label for="empDept">Department *</label>
              <select id="empDept" class="form-control" required>
                <option value="">Select Department</option>
                <option value="BSHM">BSHM</option>
                <option value="BSED">BSED</option>
                <option value="BEED">BEED</option>
                <option value="BSCRIM">BSCRIM</option>
                <option value="BSIT">BSIT</option>
                <option value="BSBA">BSBA</option>
              </select>
            </div>
          </div>

          <div style="margin-top:20px;display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary" id="saveBtn">
              <i class="fa-solid fa-floppy-disk"></i> Save Employee
            </button>
            <button type="button" class="btn btn-outline" onclick="resetForm()">Cancel</button>
          </div>
        </form>
      </div>

      <!-- EMPLOYEE RECORDS -->
      <div class="card" style="margin-top:25px;">
        <h2 class="card-title">
          <i class="fa-solid fa-folder-open"></i>
          Employee Records (Descending)
        </h2>
      </div>
    </div>
  </div>
</div>

<script src="./database.js"></script>
<script>
  function toggleRegPassword() {
    const passInput = document.getElementById("empPass");
    const toggleBtn = document.getElementById("toggleRegPass");
    if (!passInput || !toggleBtn) return;

    const isHidden = passInput.type === "password";
    passInput.type = isHidden ? "text" : "password";
    const icon = toggleBtn.querySelector("i");
    if (icon) {
      icon.classList.toggle("fa-eye", !isHidden);
      icon.classList.toggle("fa-eye-slash", isHidden);
    }
    toggleBtn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
    toggleBtn.setAttribute("title", isHidden ? "Hide Password" : "Show Password");
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (typeof renderEmployeeTable === "function") {
      renderEmployeeTable();
    }
  });
</script>

</body>
</html>
