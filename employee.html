<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Registration - DAS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <script src="app.js"></script>
  <script>checkAuth();</script>

  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-graduation-cap"></i>
        <h2>Digital Attendance System</h2>
        <p>Admin Panel</p>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li class="active"><a href="employee.html"><i class="fa-solid fa-user-plus"></i> Employee Registration</a></li>
        <li><a href="attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance Record</a></li>
        <li><a href="monthly.html"><i class="fa-solid fa-calendar-days"></i> Monthly Record</a></li>
        <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></li>
      </ul>
    </div>

    <div class="main-content">
      <div class="topbar">
        <div><i class="fa-solid fa-bars"></i></div>
        <div class="topbar-info">
          <span><i class="fa-regular fa-calendar"></i> <span id="currentDate"></span></span>
        </div>
      </div>

      <div class="content-area">
        <h1 style="font-size: 1.5rem; margin-bottom: 20px;"><i class="fa-solid fa-user-plus" style="color: var(--primary-blue);"></i> Employee Registration</h1>
        
        <div class="card">
          <form id="regForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label>Employee ID *</label>
                <input type="text" id="empId" class="form-control" required placeholder="Enter Employee ID">
              </div>
              <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="empName" class="form-control" required placeholder="Enter Full Name">
              </div>
              <div class="form-group">
                <label>Password *</label>
                <input type="password" id="empPass" class="form-control" required placeholder="Enter Password">
              </div>
              <div class="form-group">
                <label>Position *</label>
                <input type="text" id="empPos" class="form-control" required placeholder="Enter Position">
              </div>
              <div class="form-group">
                <label>Department *</label>
                <select id="empDept" class="form-control" required>
                  <option value="">Select Department</option>
                  <option value="Faculty">Faculty</option>
                  <option value="Staff">Staff</option>
                </select>
              </div>
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Employee</button>
              <button type="reset" class="btn btn-outline">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="database.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const employees = DB.getEmployees();
      
      const newEmp = {
        id: document.getElementById('empId').value,
        name: document.getElementById('empName').value,
        password: document.getElementById('empPass').value,
        position: document.getElementById('empPos').value,
        department: document.getElementById('empDept').value
      };

      employees.push(newEmp);
      DB.saveEmployees(employees);
      alert('Employee successfully registered!');
      this.reset();
    });
  </script>
</body>
</html>
