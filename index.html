<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance - Time In/Out</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="kiosk-body">

    <div class="kiosk-card">
        <div class="kiosk-heading">
            <i class="fa-regular fa-clock"></i>
            <h1>Employee Attendance</h1>
            <p>Time In and Time Out</p>
        </div>

        <form id="kioskForm">
            <div class="form-group">
                <label for="kioskId">Employee ID</label>
                <input
                    type="text"
                    id="kioskId"
                    class="form-control"
                    placeholder="Enter Employee ID"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="kioskPass">Password</label>
                <div class="password-container">
                    <input
                        type="password"
                        id="kioskPass"
                        class="form-control"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required
                    >
                    <i class="fa-solid fa-eye" id="toggleKioskPass"></i>
                </div>
            </div>

            <div class="kiosk-buttons">
                <button type="button" id="timeInBtn" class="time-in-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    TIME IN
                </button>

                <button type="button" id="timeOutBtn" class="time-out-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    TIME OUT
                </button>
            </div>
        </form>

        <div class="kiosk-footer">
            <p>— Be On Time. Be Productive. —</p>
            <a href="login.html" class="admin-link">Admin Access</a>
        </div>
    </div>

    <!-- Automatic notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Load the existing database -->
    <script src="database.js"></script>

    <script>
        const kioskId = document.getElementById("kioskId");
        const kioskPass = document.getElementById("kioskPass");
        const toast = document.getElementById("toast");

        let toastTimer;

        // Automatic notification: disappears without clicking OK
        function showToast(message, type = "success") {
            toast.textContent = message;
            toast.className = "toast show " + type;

            clearTimeout(toastTimer);

            toastTimer = setTimeout(function () {
                toast.className = "toast";
            }, 3000);
        }

        // Get local date instead of UTC date
        function getLocalDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        // Show / hide password
        document.getElementById("toggleKioskPass")
            .addEventListener("click", function () {
                const isPassword = kioskPass.type === "password";

                kioskPass.type = isPassword ? "text" : "password";
                this.classList.toggle("fa-eye-slash", isPassword);
                this.classList.toggle("fa-eye", !isPassword);
            });

        function handleAttendance(type) {
            const id = kioskId.value.trim();
            const password = kioskPass.value;

            if (!id || !password) {
                showToast("Please enter your Employee ID and Password.", "error");
                return;
            }

            // Make sure the existing database is loaded
            if (
                typeof DB === "undefined" ||
                typeof DB.getEmployees !== "function" ||
                typeof DB.getAttendance !== "function" ||
                typeof DB.saveAttendance !== "function"
            ) {
                showToast("Database not loaded. Check database.js.", "error");
                return;
            }

            try {
                const employees = DB.getEmployees() || [];

                const employee = employees.find(function (emp) {
                    return String(emp.id) === id &&
                           String(emp.password) === password;
                });

                if (!employee) {
                    showToast("Incorrect Employee ID or Password.", "error");
                    return;
                }

                const records = DB.getAttendance() || [];
                const today = getLocalDate();
                const currentTime = new Date().toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                const record = records.find(function (item) {
                    return String(item.id) === String(employee.id) &&
                           item.date === today;
                });

                // TIME IN
                if (type === "TIME_IN") {
                    if (record && record.timeIn && record.timeIn !== "--") {
                        showToast("You have already timed in today.", "error");
                        return;
                    }

                    if (record) {
                        record.name = employee.name;
                        record.timeIn = currentTime;
                        record.timeOut = record.timeOut || "--";
                        record.status = "Present";
                    } else {
                        records.push({
                            id: employee.id,
                            name: employee.name,
                            date: today,
                            timeIn: currentTime,
                            timeOut: "--",
                            status: "Present"
                        });
                    }

                    if (!DB.saveAttendance(records)) {
                        showToast("Unable to save Time In. Please try again.", "error");
                        return;
                    }

                    showToast(
                        `SUCCESS! Time In recorded for ${employee.name} at ${currentTime}`,
                        "success"
                    );
                }

                // TIME OUT
                else if (type === "TIME_OUT") {
                    if (!record || !record.timeIn || record.timeIn === "--") {
                        showToast("Please Time In first before Time Out.", "error");
                        return;
                    }

                    if (record.timeOut && record.timeOut !== "--") {
                        showToast("You have already timed out today.", "error");
                        return;
                    }

                    record.timeOut = currentTime;

                    if (!DB.saveAttendance(records)) {
                        showToast("Unable to save Time Out. Please try again.", "error");
                        return;
                    }

                    showToast(
                        `SUCCESS! Time Out recorded for ${employee.name} at ${currentTime}`,
                        "success"
                    );
                } else {
                    showToast("Invalid attendance action.", "error");
                    return;
                }

                // Clear the form after successful attendance
                document.getElementById("kioskForm").reset();
                kioskId.focus();

            } catch (error) {
                console.error("Attendance Error:", error);
                showToast("An error occurred while saving attendance.", "error");
            }
        }

        // Button events
        document.getElementById("timeInBtn").addEventListener("click", function () {
            handleAttendance("TIME_IN");
        });

        document.getElementById("timeOutBtn").addEventListener("click", function () {
            handleAttendance("TIME_OUT");
        });
    </script>

</body>
</html>
