<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Digital Attendance System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div style="text-align: center; margin-bottom: 20px;">
      <i class="fa-solid fa-shield-halved" style="font-size: 3rem; color: #0d6efd;"></i>
      <h2 style="margin-top: 10px;">Admin Login</h2>
      <p style="color: #6c757d; font-size: 0.85rem;">Sign in to access the dashboard</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> Admin Username</label>
        <input type="text" id="username" class="form-control" required placeholder="Enter Username">
      </div>
      
      <div class="form-group">
        <label><i class="fa-solid fa-lock"></i> Admin Password</label>
        <div class="password-container">
          <input type="password" id="password" class="form-control" required placeholder="Enter Password">
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">
        <i class="fa-solid fa-right-to-bracket"></i> LOG IN
      </button>
    </form>
  </div>

  <script>
    // Password toggle function para sa Admin Login
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    togglePassword.addEventListener('click', function () {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      this.classList.toggle('fa-eye-slash');
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if(u === 'admin' && p === 'admin123') {
        sessionStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'dashboard.html';
      } else {
        alert('Maling Username o Password! (Use: admin / admin123)');
      }
    });
  </script>
</body>
</html>
