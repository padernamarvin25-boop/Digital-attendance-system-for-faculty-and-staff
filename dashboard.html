<!-- Search and Filter -->
<div class="card attendance-search-card">
    <div class="card-title">Employee Attendance Search</div>

    <div class="search-filter-container">
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input
                type="text"
                id="employeeSearch"
                placeholder="Search employee name or ID..."
            >
        </div>

        <div class="filter-box">
            <select id="attendanceFilter">
                <option value="all">All Employees</option>
                <option value="present">Present</option>
                <option value="absent">Absent</option>
                <option value="ontime">On Time</option>
                <option value="late">Late</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="attendance-search-table">
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>Time In</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="employeeSearchResults">
                <tr>
                    <td colspan="4">Loading employees...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <p id="searchResultCount" class="search-result-count"></p>
</div>
