<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Attendance - Time In/Out</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./all.min.css">

  <style>
    .password-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-container input.form-control {
      width: 100%;
      padding-right: 42px !important;
    }

    .eye-icon-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #555;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      line-height: 1;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eye-icon-btn:hover {
      color: #0d6efd;
    }
  </style>
</head>

<body class="kiosk-body">
  <div class="kiosk-card">
    <div class="kiosk-heading">
      <i class="fa-regular fa-clock"></i>
      <h1>Employee Attendance</h1>
      <p>Morning (AM/PM) &amp; Afternoon (AM/PM) Time In / Time Out</p>
    </div>

    <form id="kioskForm">
      <div class="form-group">
        <label for="kioskId">Employee ID</label>
        <input type="text" id="kioskId" class="form-control" required placeholder="Enter Employee ID" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="kioskPass">Password</label>
        <div class="password-container">
          <input type="password" id="kioskPass" class="form-control" required placeholder="Enter Password" autocomplete="current-password">
          <button type="button" id="toggleKioskPass" class="eye-icon-btn" title="Show Password" aria-label="Show Password" onclick="toggleKioskPassword()">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="kioskSlot">Attendance Session</label>
        <select id="kioskSlot" class="form-control">
          <option value="MORNING_AM">Morning — AM</option>
          <option value="MORNING_PM">Morning — PM</option>
          <option value="AFTERNOON_AM">Afternoon — AM</option>
          <option value="AFTERNOON_PM">Afternoon — PM</option>
        </select>
      </div>

      <div class="kiosk-buttons">
        <button type="button" id="timeInBtn" class="time-in-btn">
          <i class="fa-solid fa-right-to-bracket"></i> TIME IN
        </button>
        <button type="button" id="timeOutBtn" class="time-out-btn">
          <i class="fa-solid fa-right-from-bracket"></i> TIME OUT
        </button>
      </div>

      <div id="kioskStatusMsg" style="display:none;" aria-live="polite"></div>
    </form>

    <div class="kiosk-footer">
      <p>&mdash; Be On Time. Be Productive. &mdash;</p>
      <a href="./login.html" class="admin-link">Admin Access</a>
    </div>
  </div>

  <script src="./database.js"></script>
  <script src="./app.js"></script>
  <script>
    const toggleKioskPass = document.getElementById("toggleKioskPass");
    const kioskPass = document.getElementById("kioskPass");
    const kioskSlot = document.getElementById("kioskSlot");

    function setDefaultSlot() {
      if (!kioskSlot) return;
      const hour = new Date().getHours();
      kioskSlot.value = hour < 12 ? "MORNING_AM" : "AFTERNOON_PM";
    }

    function setKioskEyeState(isVisible) {
      if (kioskPass) {
        kioskPass.type = isVisible ? "text" : "password";
      }
      if (toggleKioskPass) {
        const icon = toggleKioskPass.querySelector("i");
        if (icon) {
          icon.classList.toggle("fa-eye", !isVisible);
          icon.classList.toggle("fa-eye-slash", isVisible);
        }
        toggleKioskPass.setAttribute("title", isVisible ? "Hide Password" : "Show Password");
        toggleKioskPass.setAttribute("aria-label", isVisible ? "Hide Password" : "Show Password");
      }
    }

    function toggleKioskPassword() {
      if (!kioskPass) return;
      setKioskEyeState(kioskPass.type === "password");
    }

    setDefaultSlot();

    function runKioskAction(actionType) {
      const id = document.getElementById("kioskId").value.trim();
      const pass = document.getElementById("kioskPass").value;
      const slot = document.getElementById("kioskSlot").value;

      if (!id || !pass) {
        showInlineNotice("kioskStatusMsg", "Please enter Employee ID and Password.", false);
        return;
      }

      if (!window.DB || typeof DB.getEmployees !== "function") {
        showInlineNotice("kioskStatusMsg", "Database not loaded.", false);
        return;
      }

      const employees = DB.getEmployees() || [];
      const emp = employees.find(e => String(e.id) === id && String(e.password) === pass);
      if (!emp) {
        showInlineNotice("kioskStatusMsg", "Invalid Employee ID or Password.", false);
        return;
      }

      const result = recordMorningAfternoonAttendance(id, actionType, slot);
      showInlineNotice("kioskStatusMsg", result.message, result.ok);

      if (result.ok) {
        document.getElementById("kioskForm").reset();
        setKioskEyeState(false);
        setDefaultSlot();
      }
    }

    document.getElementById("timeInBtn").addEventListener("click", () => runKioskAction("TIME_IN"));
    document.getElementById("timeOutBtn").addEventListener("click", () => runKioskAction("TIME_OUT"));
  </script>
</body>
</html>
