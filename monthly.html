
<style>
/* =====================================
   MODERN MONTHLY RECORD DESIGN
   Existing functions remain unchanged
===================================== */

:root {
  --primary-blue: #2563eb;
  --dark-blue: #1e40af;
  --light-bg: #f1f5f9;
  --card-bg: #ffffff;
  --text-dark: #1e293b;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --green: #198754;
  --red: #dc3545;
}

* {
  box-sizing: border-box;
}

body {
  background: var(--light-bg);
  color: var(--text-dark);
}

/* MAIN CONTENT */

.main-content {
  background: #f1f5f9;
}

.content-area {
  padding: 28px;
  max-width: 1600px;
  margin: auto;
}

/* SIDEBAR */

.sidebar {
  background: linear-gradient(180deg, #172554, #1e3a8a);
  box-shadow: 4px 0 15px rgba(15, 23, 42, 0.12);
}

.sidebar-header {
  padding: 25px 18px;
}

.sidebar-header i {
  font-size: 34px;
  margin-bottom: 12px;
  color: #93c5fd;
}

.sidebar-header h2 {
  font-size: 19px;
  font-weight: 700;
}

.sidebar-menu {
  padding: 10px;
}

.sidebar-menu li {
  margin: 6px 0;
}

.sidebar-menu li a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 15px;
  border-radius: 9px;
  transition: 0.25s;
}

.sidebar-menu li a:hover {
  background: rgba(255,255,255,0.13);
  transform: translateX(3px);
}

.sidebar-menu li.active a {
  background: #2563eb;
  color: white;
  box-shadow: 0 4px 12px rgba(37,99,235,0.25);
}

.sidebar-footer {
  border-top: 1px solid rgba(255,255,255,0.15);
  padding: 18px;
}

/* TOPBAR */

.topbar {
  background: white;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border-color);
  box-shadow: 0 2px 8px rgba(15,23,42,0.04);
}

.topbar-info {
  color: var(--text-muted);
  font-weight: 600;
}

/* PAGE HEADER */

.page-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.page-heading {
  color: #1e293b;
  font-size: 28px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.5px;
}

.page-heading i {
  margin-right: 8px;
}

/* FILTERS */

.month-filter {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: white;
  padding: 15px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(15,23,42,0.04);
}

.month-filter label {
  font-size: 13px;
  font-weight: 700;
  color: #475569;
}

.form-control {
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 10px 12px;
  background: #fff;
  color: #1e293b;
  transition: 0.2s;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary-blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

/* CARDS */

.card {
  background: white;
  border: 1px solid var(--border-color);
  border-radius: 13px;
  padding: 22px;
  box-shadow: 0 3px 12px rgba(15,23,42,0.045);
  margin-bottom: 20px;
}

.group-section-card {
  margin-top: 24px;
  padding: 24px;
  overflow: hidden;
}

.monthly-table-title {
  font-size: 19px;
  font-weight: 800;
  color: #1e40af;
  margin-bottom: 5px;
}

/* SEARCH */

.filter-area {
  display: flex;
  gap: 12px;
}

#monthlySearch {
  min-height: 46px;
  padding: 12px 16px;
  border-radius: 9px;
  background: #f8fafc;
  border: 1px solid #cbd5e1;
}

#monthlySearch:focus {
  background: white;
  border-color: var(--primary-blue);
}

/* BUTTONS */

.btn,
.bulk-receipt-btn,
.receipt-btn,
.edit-attendance-btn,
.delete-attendance-btn {
  border-radius: 8px;
  padding: 9px 13px;
  font-weight: 700;
  font-size: 13px;
  transition: all 0.2s ease;
  cursor: pointer;
}

.btn:hover,
.bulk-receipt-btn:hover,
.receipt-btn:hover,
.edit-attendance-btn:hover,
.delete-attendance-btn:hover {
  transform: translateY(-2px);
}

.btn-outline {
  background: white;
  border: 1px solid #cbd5e1;
  color: #334155;
}

.btn-outline:hover {
  background: #eff6ff;
  border-color: var(--primary-blue);
  color: var(--primary-blue);
}

.btn-primary {
  background: var(--primary-blue);
  color: white;
  border: none;
}

/* DEPARTMENT FOLDERS */

.dept-folder-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
  margin-bottom: 18px;
}

.dept-folder-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 15px;
  border: 1px solid #dbe3ed;
  border-radius: 9px;
  background: #f8fafc;
  color: #475569;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: 0.2s;
}

.dept-folder-btn:hover {
  background: #eff6ff;
  border-color: #93c5fd;
  color: #1d4ed8;
}

.dept-folder-btn.active {
  background: #2563eb;
  border-color: #2563eb;
  color: white;
  box-shadow: 0 3px 8px rgba(37,99,235,0.2);
}

.dept-folder-btn.staff-folder.active {
  background: #198754;
  border-color: #198754;
  color: white;
}

.dept-count-badge {
  background: rgba(15,23,42,0.1);
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
}

.dept-folder-btn.active .dept-count-badge {
  background: rgba(255,255,255,0.22);
  color: white;
}

/* TABLE */

.table-wrapper {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border-color);
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

table thead th {
  background: #eff6ff;
  color: #1e40af;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 15px 12px;
  border-bottom: 2px solid #dbeafe;
  white-space: nowrap;
  text-align: center;
}

table tbody td {
  padding: 14px 12px;
  font-size: 13px;
  color: #334155;
  border-bottom: 1px solid #e2e8f0;
  text-align: center;
  white-space: nowrap;
}

table tbody tr {
  transition: background 0.2s;
}

table tbody tr:hover {
  background: #f8fafc;
}

table tbody tr:last-child td {
  border-bottom: none;
}

table tbody td strong {
  color: #1e293b;
}

/* TAGS */

.department-tag {
  display: inline-block;
  background: #dbeafe;
  color: #1d4ed8;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}

.days-tag {
  display: inline-block;
  background: #dcfce7;
  color: #15803d;
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}

/* ACTION BUTTONS */

.edit-attendance-btn {
  color: #2563eb;
  border: 1px solid #bfdbfe;
  background: #eff6ff;
}

.edit-attendance-btn:hover {
  background: #2563eb;
  color: white;
}

.delete-attendance-btn {
  color: #dc3545;
  border: 1px solid #fecaca;
  background: #fff1f2;
}

.delete-attendance-btn:hover {
  background: #dc3545;
  color: white;
}

.receipt-btn {
  color: #15803d;
  border: 1px solid #bbf7d0;
  background: #f0fdf4;
}

.receipt-btn:hover {
  background: #198754;
  color: white;
}

.bulk-receipt-btn {
  background: #198754;
  color: white;
  border: none;
  padding: 11px 16px;
}

.bulk-receipt-btn:hover {
  background: #157347;
}

/* EMPTY MESSAGE */

.empty-message {
  text-align: center !important;
  padding: 35px !important;
  color: #94a3b8 !important;
  font-weight: 600;
}

/* RECEIPT MODAL */

.dtr-modal-backdrop {
  background: rgba(15,23,42,0.65);
  backdrop-filter: blur(4px);
  padding: 20px;
}

.dtr-modal-box {
  background: white;
  width: 100%;
  max-width: 1100px;
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 15px;
  padding: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.dtr-modal-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
}

.dtr-modal-toolbar h3 {
  font-weight: 800;
}

.dtr-batch-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px;
  margin-bottom: 20px;
  border-radius: 10px;
  background: #f8fafc;
  border: 1px solid var(--border-color);
}

.dtr-batch-controls select {
  padding: 9px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  background: white;
}

.dtr-employee-page {
  margin-bottom: 25px;
}

.dtr-twin-sheet {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  background: white;
  color: #111;
  padding: 10px;
}

.dtr-copy {
  border: 1px solid #222;
  padding: 14px 16px;
  font-size: 11.5px;
  line-height: 1.35;
}

/* RESPONSIVE DESIGN */

@media (max-width: 1100px) {
  .page-header-row {
    align-items: flex-start;
  }

  .month-filter {
    width: 100%;
  }

  .group-section-card {
    padding: 17px;
  }
}

@media (max-width: 768px) {
  .content-area {
    padding: 15px;
  }

  .page-heading {
    font-size: 23px;
  }

  .month-filter {
    padding: 12px;
  }

  .month-filter label {
    width: 100%;
  }

  .month-filter input,
  .month-filter button {
    flex: 1;
    min-width: 120px;
  }

  .group-section-card {
    padding: 15px;
  }

  .dept-folder-bar {
    gap: 7px;
  }

  .dept-folder-btn {
    padding: 8px 10px;
    font-size: 11px;
  }

  .dtr-modal-box {
    padding: 15px;
  }

  .dtr-twin-sheet {
    grid-template-columns: 1fr;
  }

  .dtr-batch-controls {
    align-items: stretch;
  }

  .dtr-batch-controls select {
    width: 100%;
  }

  .dtr-modal-toolbar {
    align-items: flex-start;
  }
}

/* PRINT - PRESERVE ORIGINAL DTR FORMAT */

@media print {
  body * {
    visibility: hidden !important;
  }

  #dtrModalBackdrop,
  #dtrModalBackdrop * {
    visibility: visible !important;
  }

  #dtrModalBackdrop {
    position: static !important;
    background: none !important;
    padding: 0 !important;
    display: block !important;
  }

  .dtr-modal-toolbar,
  .dtr-batch-controls {
    display: none !important;
  }

  .dtr-modal-box {
    max-height: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    max-width: 100% !important;
    overflow: visible !important;
  }

  .dtr-employee-page {
    page-break-after: always;
    break-after: page;
    margin-bottom: 0 !important;
  }

  .dtr-employee-page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  .dtr-twin-sheet {
    grid-template-columns: 1fr 1fr !important;
    gap: 14px !important;
    padding: 0 !important;
  }

  .dtr-copy {
    border: 1px solid #222 !important;
    color: #000 !important;
  }
}
</style>
