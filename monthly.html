<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Record - DAS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <script src="app.js"></script>
  <script>checkAuth();</script>

  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-graduation-cap"></i>
        <h2>Digital Attendance System</h2>
        <p>Admin Panel</p>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="employee.html"><i class="fa-solid fa-user-plus"></i> Employee Registration</a></li>
        <li><a href="attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance Record</a></li>
        <li class="active"><a href="monthly.html"><i class="fa-solid fa-calendar-days"></i> Monthly Record</a></li>
        <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></li>
      </ul>
    </div>

    <div class="main-content">
      <div class="topbar">
        <div><i class="fa-solid fa-bars"></i></div>
        <div class="topbar-info">
          <span><i class="fa-regular fa-calendar"></i> <span id="currentDate"></span></span>
        </div>
      </div>

      <div class="content-area">
        <h1 style="font-size: 1.5rem; margin-bottom: 20px;">Monthly Attendance Overview</h1>

        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Total Days Present</th>
              </tr>
            </thead>
            <tbody id="monthlyTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="database.js"></script>
  <script>
    const employees = DB.getEmployees();
    const records = DB.getAttendance();
    const tbody = document.getElementById('monthlyTable');

    tbody.innerHTML = employees.map(emp => {
      const count = records.filter(r => r.id === emp.id).length;
      return `
        <tr>
          <td>${emp.id}</td>
          <td>${emp.name}</td>
          <td><strong>${count} days</strong></td>
        </tr>
      `;
    }).join('');
  </script>
</body>
</html>
